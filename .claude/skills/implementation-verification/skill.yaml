schemaVersion: 1

id: implementation-verification
name: Implementation Verification
version: 1

description: >
  Verifies implemented changes before they are presented for human review -
  reviews the diff for unintended edits, runs the stack-appropriate real
  checks, and reports pass/fail/not-run honestly without weakening tests
  to force a green result.

inputs:
  - name: plan
    type: object
    description: implementation-planning's output for the same ticket - informs which checks are actually relevant (filesToChange/testChanges).
    required: true

outputs:
  - name: verificationReport
    type: object
    description: >
      The deterministic structure defined in SKILL.md's "Output / result
      contract" - changed files, every check run with its real status, plan
      deviations, and residual risks.

preconditions:
  - A safe-git-branch-prepared branch exists with the implementation's changes present (committed or uncommitted).
  - plan is available for the same ticket, to know which stacks/checks are actually relevant.

stopConditions:
  - A required check for a touched stack fails and cannot be fixed within the ticket's own scope - report the failure plainly, never claim completion.
  - A required tool is unavailable (not installed, no network, no credentials) - report which check could not run and why, never silently treat "not run" as "passed."

allowedActionCategories:
  - read-only
