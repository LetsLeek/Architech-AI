schemaVersion: 1

id: repository-investigation
name: Repository Investigation
version: 1

description: >
  Inspects the current repository state relevant to a ticket's
  implementationContext before any planning or code edit happens, and
  produces a repositoryContext that clearly separates verified facts from
  assumptions.

inputs:
  - name: implementationContext
    type: object
    description: >
      The output of jira-ticket-intake (or, for standalone use, any object
      with at least summary/description text naming what to investigate).
    required: true

outputs:
  - name: repositoryContext
    type: object
    description: >
      The deterministic structure defined in SKILL.md's "Output / result
      contract" - inspected files, existing conventions/boundaries,
      verified facts vs. assumptions, and unresolved questions.

preconditions:
  - The repository is checked out locally and readable.
  - implementationContext names or clearly implies what to look for (a
    package, a class, a behavior) - if it doesn't, investigation has
    nothing to anchor to and this skill cannot proceed usefully.

stopConditions:
  - A file/class/package the ticket explicitly depends on does not exist anywhere in the current repository, and its absence changes which implementation approach is viable.
  - Multiple candidate files could plausibly be "the" place to change, and picking the wrong one would materially change the implementation - report the ambiguity rather than guessing.

allowedActionCategories:
  - read-only
