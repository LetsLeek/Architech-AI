schemaVersion: 1

id: implementation-planning
name: Implementation Planning
version: 1

description: >
  Turns a validated implementationContext and repositoryContext into a
  bounded implementation plan before any code change begins - the smallest
  change that satisfies the ticket's acceptance criteria and the
  repository's existing architecture, with risks/scope/tests always
  represented explicitly.

inputs:
  - name: implementationContext
    type: object
    description: jira-ticket-intake's output.
    required: true
  - name: repositoryContext
    type: object
    description: repository-investigation's output, for the same ticket.
    required: true

outputs:
  - name: plan
    type: object
    description: >
      The deterministic structure defined in SKILL.md's "Output / result
      contract" - goal, scope, files to change, new files, data/schema/
      config impacts, test changes, risks, dependencies, migration
      considerations, explicit out-of-scope items, and sensitivity flags.

preconditions:
  - repositoryContext was produced for the same ticket as implementationContext (same issueKey).
  - repositoryContext did not itself stop with an unresolved blocker (a plan cannot safely be built on an investigation that never completed).

stopConditions:
  - repositoryContext reports a stop condition of its own (missing reference, unresolved ambiguity) that a plan cannot route around without guessing.
  - No plan can be constructed that stays grounded in repositoryContext's verifiedFacts - every candidate approach requires inventing a file path or architecture repository-investigation never actually confirmed.

allowedActionCategories:
  - read-only
