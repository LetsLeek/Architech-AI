version: 2

# AIW-94: security-vulnerability-triggered PRs are handled separately by the repo's
# "Dependabot security updates" setting (enabled via the API, not here) - this file only
# configures *routine* version-update PRs, on a controlled weekly cadence rather than
# Dependabot's daily default, with each ecosystem's PR volume capped so updates stay reviewable
# instead of becoming background noise.
#
# AIW-100: every entry also waits 7 days after a new version is published before proposing it
# (`cooldown`) - a newly published package can turn out malicious or broken (a real supply-chain
# pattern, not hypothetical) and a short wait lets that surface before this repo pulls it in.
# Flagged by Semgrep's own dependabot-missing-cooldown rule (already running via sast-ci.yml).
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      # Patch/minor bumps rarely need individual review - one grouped PR per week instead of
      # one per dependency. A major bump (more likely to need actual code changes) stays its
      # own PR so it doesn't get lost inside a group.
      routine-updates:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      routine-updates:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      routine-updates:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    # AIW-93 pinned every `uses:` to a full commit SHA (supply-chain hardening) - Dependabot
    # still tracks and bumps SHA-pinned actions correctly, updating the trailing version
    # comment alongside the SHA, so that hardening and staying current aren't in tension.
