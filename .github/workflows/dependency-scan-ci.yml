name: Dependency Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# AIW-94: GitHub's native "Dependency review" action needs GitHub Advanced Security on a
# private repo - same gap AIW-93 hit for CodeQL (verified via the API: GET
# .../dependency-graph/compare/... 403s). Trivy's filesystem scan is the approved fallback -
# see docs/operations/ci-quality-gate-policy.md's "SAST: CodeQL vs. Semgrep fallback" section
# (this gate follows the identical two-pass pattern). Dependabot alerts, security updates and
# scheduled version-update PRs (.github/dependabot.yml) are NOT affected by the GHAS gap - those
# are enabled separately via repo settings and don't need this workflow.
permissions:
  contents: read

env:
  TRIVY_VERSION: "0.74.0"
  TRIVY_SHA256: "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"

jobs:
  trivy:
    name: Dependency scan (Trivy)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Warm Maven dependency cache
        # Populates ~/.m2 before Trivy resolves backend/pom.xml's dependency tree itself -
        # without this, Trivy hits Maven Central directly and can get rate-limited (429),
        # observed locally during this ticket's own verification.
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress dependency:go-offline

      - name: Install Trivy
        # Pinned release tarball + checksum verification, not a piped install script from a
        # mutable branch ref (exactly the supply-chain pattern AIW-93 hardened elsewhere).
        run: |
          curl -sfL -o trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          tar xzf trivy.tar.gz trivy
          sudo mv trivy /usr/local/bin/
          rm trivy.tar.gz

      - name: Full scan (report, never blocks)
        # --include-dev-deps: Trivy's default excludes npm devDependencies (e2e/'s only
        # dependency, @playwright/test, is one) - AIW-94's AC wants both ecosystems fully
        # covered, not just production deps.
        run: trivy fs --scanners vuln --include-dev-deps --format sarif --output trivy.sarif .

      - name: Upload SARIF report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-sarif
          path: trivy.sarif
          retention-days: 14

      - name: Gate on new HIGH/CRITICAL findings
        run: trivy fs --scanners vuln --include-dev-deps --severity HIGH,CRITICAL --exit-code 1 .
