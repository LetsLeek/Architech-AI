name: Backend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# AIW-99: a new push to the same PR/branch makes any run already in flight for it redundant -
# cancelling it frees the runner immediately instead of letting it finish uselessly.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    # AIW-99: observed ~75s at time of writing - generous multiple so real CI variance (cold
    # runner, dependency-download hiccups) doesn't cause a flaky timeout, while still failing
    # clearly well before GitHub's 360-minute default would let a genuinely hung job sit there.
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build, test and check coverage
        working-directory: backend
        # `verify` runs unit tests (Surefire) + integration tests against a disposable
        # Testcontainers Postgres (Failsafe, AIW-91) + jacoco:check (AIW-90) - a test failure
        # in either phase, or a coverage regression below the locked-in floor, fails the build.
        # No manually-provisioned Postgres needed here anymore - Testcontainers owns its own.
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/
          retention-days: 14

      - name: Upload test reports
        # AIW-100: raw Surefire/Failsafe output (per-test result + full stack trace on
        # failure) - lets a developer see exactly what failed without re-running locally.
        # Short retention: only useful for debugging a recent failure, never needed later.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          retention-days: 7

      - name: Write coverage summary to job summary
        # AIW-100: a developer sees line/branch % directly on the run's summary page instead
        # of having to download and open the HTML coverage artifact just to see the headline
        # numbers - no source snippets or file-level detail here, just the two aggregate
        # percentages already reported (nothing more sensitive than what AIW-90 already made
        # a public-to-the-team build artifact).
        if: always()
        working-directory: backend
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F',' 'NR==1{for(i=1;i<=NF;i++)h[i]=$i} NR>1{for(i=3;i<=NF;i++)s[h[i]]+=$i} END{
              line_pct = 100*s["LINE_COVERED"]/(s["LINE_COVERED"]+s["LINE_MISSED"]);
              branch_pct = 100*s["BRANCH_COVERED"]/(s["BRANCH_COVERED"]+s["BRANCH_MISSED"]);
              printf "## Backend coverage\n\n";
              printf "| Metric | Covered | Missed | %% |\n|---|---|---|---|\n";
              printf "| Line | %d | %d | %.1f%% |\n", s["LINE_COVERED"], s["LINE_MISSED"], line_pct;
              printf "| Branch | %d | %d | %.1f%% |\n", s["BRANCH_COVERED"], s["BRANCH_MISSED"], branch_pct;
            }' target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
          fi

  docker-build:
    name: Backend Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # AIW-101: job-level permissions replace the workflow-level default for this job, not add
    # to it - contents: read is restated alongside the two new scopes attestations need.
    permissions:
      contents: read
      attestations: write
      id-token: write

    env:
      TRIVY_VERSION: "0.74.0"
      TRIVY_SHA256: "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Builds only - proves the image is reproducible in CI (AIW-68 AC), never pushed to any
      # registry here. Pushing to Azure Container Registry is AIW-70's own concern, once that
      # registry and its credentials actually exist. Since nothing here ever authenticates to a
      # registry, there are no registry credentials that could leak into these logs (AIW-96 AC).
      - name: Build image
        working-directory: backend
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t architech-backend:${{ github.sha }} .

      - name: Install Trivy
        # AIW-96: scans this exact just-built image (by tag, before anything could push or
        # retag it) - same pinned, checksum-verified install pattern as AIW-94's filesystem
        # scan; Trivy's vulnerability DB is downloaded fresh at scan time either way.
        run: |
          curl -sfL -o trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          tar xzf trivy.tar.gz trivy
          sudo mv trivy /usr/local/bin/
          rm trivy.tar.gz

      - name: Full image scan (report, never blocks)
        run: trivy image --scanners vuln --format sarif --output trivy-image.sarif architech-backend:${{ github.sha }}

      - name: Upload SARIF report
        # AIW-100: 30 days, not the 14-day default - small text file with real audit value.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-image-sarif
          path: trivy-image.sarif
          retention-days: 30

      - name: Write findings to job summary
        if: always()
        run: |
          total=$(jq '[.runs[0].results[]] | length' trivy-image.sarif)
          {
            echo "## Backend Docker image findings (Trivy)"
            echo ""
            echo "Total findings (any severity): **${total}**"
            echo ""
            if [ "$total" -gt 0 ]; then
              jq -r '.runs[0].results[] | "<details><summary>\(.ruleId) (\(.level // "note")) - \(.locations[0].physicalLocation.artifactLocation.uri)</summary>\n\n\(.message.text)\n\n</details>\n"' trivy-image.sarif | head -c 60000
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Gate on fixable HIGH/CRITICAL findings
        # --ignore-unfixed: a HIGH/CRITICAL finding with no available fix isn't something this
        # PR (or anyone) can act on today - it stays visible in the SARIF report above and gets
        # triaged, but doesn't block, per AIW-96's own AC ("vulnerabilities... with an available
        # fix block release"). Anything this filter lets through and still blocks IS actionable
        # right now - bump the base image / apk package, the same way AIW-96 itself fixed its
        # own baseline findings via the Dockerfile's `apk upgrade` step.
        run: trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 architech-backend:${{ github.sha }}

      - name: Compute image digest
        # AIW-101: no registry exists yet (AIW-70), so there's no RepoDigest from a push - the
        # image's own content-addressed ID (config digest) is the stable identifier this job
        # can produce without one, and what SBOM/provenance below are both tied to.
        id: image
        run: echo "digest=$(docker inspect --format='{{.Id}}' architech-backend:${{ github.sha }})" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM (CycloneDX)
        # AIW-101: reuses the Trivy binary already installed above - one maintained tool for
        # both vulnerability scanning (AIW-96) and SBOM generation, not two separate ones.
        run: trivy image --format cyclonedx --output sbom.cdx.json architech-backend:${{ github.sha }}

      - name: Write release metadata
        # AIW-101 AC: "release metadata identifies repository, commit SHA, workflow and built
        # artifact digest" - kept as a plain retained file independent of whether the
        # attestation steps below succeed, so this requirement is met either way.
        run: |
          cat > provenance.json <<JSON
          {
            "repository": "${{ github.repository }}",
            "commit": "${{ github.sha }}",
            "workflow": "${{ github.workflow }}",
            "runId": "${{ github.run_id }}",
            "runUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "artifactName": "architech-backend",
            "imageDigest": "${{ steps.image.outputs.digest }}",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON

      - name: Upload SBOM and release metadata
        # 30 days, matching the other small, audit-relevant text artifacts (AIW-100's
        # retention-by-type table) - not the 14-day default.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-sbom-provenance
          path: |
            sbom.cdx.json
            provenance.json
          retention-days: 30

      - name: Attest build provenance
        # AIW-101: GitHub's native build-provenance attestations aren't part of GitHub
        # Advanced Security (unlike CodeQL/dependency review/secret scanning - AIW-93/94/95)
        # and don't require a registry push; they need only `attestations: write` + `id-token:
        # write` on this job and a subject digest, both already true here. continue-on-error:
        # true so a plan limitation degrades to "not attested" rather than blocking merge -
        # provenance.json above already satisfies the AC's metadata requirement independent of
        # whether this succeeds.
        id: attest_provenance
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: architech-backend
          subject-digest: ${{ steps.image.outputs.digest }}

      - name: Attest SBOM
        id: attest_sbom
        continue-on-error: true
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: architech-backend
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: sbom.cdx.json
