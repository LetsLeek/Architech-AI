name: Backend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: architech
          POSTGRES_USER: architech
          POSTGRES_PASSWORD: architech
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U architech -d architech"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/architech
      SPRING_DATASOURCE_USERNAME: architech
      SPRING_DATASOURCE_PASSWORD: architech

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build, test and check coverage
        working-directory: backend
        # `verify` runs the `test` phase plus jacoco:check (AIW-90) - a coverage regression
        # below the locked-in floor fails the build the same way a test failure does.
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/
          retention-days: 14

  docker-build:
    name: Backend Docker image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Builds only - proves the image is reproducible in CI (AIW-68 AC), never pushed to any
      # registry here. Pushing to Azure Container Registry is AIW-70's own concern, once that
      # registry and its credentials actually exist.
      - name: Build image
        working-directory: backend
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t architech-backend:${{ github.sha }} .
