name: Secret Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# AIW-95: GitHub's native Secret Scanning / Push Protection needs GitHub Advanced Security on a
# private repository - same gap AIW-93/94 hit for CodeQL and Dependency review (confirmed via
# the API: a direct PATCH attempt to enable security_and_analysis.secret_scanning returns 422
# "Secret scanning is not available for this repository"). Gitleaks is the approved fallback -
# see docs/operations/ci-quality-gate-policy.md's "Secret scanning: Gitleaks fallback" section.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  gitleaks:
    name: Secret scan (Gitleaks)
    runs-on: self-hosted
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history, not just the PR's diff - scans every commit, not only the latest
          # one, so a secret that was later removed from HEAD but still exists somewhere in
          # git log still gets caught (per AIW-95's own AC: history matters, not just the tip).
          fetch-depth: 0

      - name: Install Gitleaks
        # Pinned release tarball + checksum verification, not a piped install script from a
        # mutable branch ref (same pattern AIW-93/94 used for Semgrep/Trivy).
        run: |
          curl -sfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
          rm gitleaks.tar.gz

      - name: Scan (report + gate)
        # Every gitleaks match is already verified/high-confidence by construction (unlike
        # Semgrep/Trivy, there's no lower-severity tier to separate out) - a SARIF report is
        # still generated for visibility, but the scan itself IS the gate: any match fails
        # this step, blocking the PR, per AIW-95's own AC.
        run: gitleaks detect --source . --report-format sarif --report-path gitleaks.sarif

      - name: Upload SARIF report
        # AIW-100: 30 days, not the 14-day default - small text file with real audit value.
        # This SARIF's `region.snippet.text` field contains the actual matched secret text -
        # that's inherent to what Gitleaks reports, not something this workflow adds; anyone
        # with access to this artifact already has repo access, so this doesn't widen exposure
        # beyond what a real leak already means, but is exactly why the job summary step below
        # deliberately never touches that field.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          retention-days: 30

      - name: Write findings to job summary
        # AIW-100: deliberately extracts only ruleId/message/file/line - never
        # `.locations[0].physicalLocation.region.snippet`, which is where Gitleaks' SARIF puts
        # the actual matched secret text. The summary should say a secret was found and where,
        # never repeat the secret itself into a more widely-viewed surface than the SARIF
        # artifact already is.
        if: always()
        run: |
          total=$(jq '[.runs[0].results[]] | length' gitleaks.sarif)
          {
            echo "## Secret scan (Gitleaks) findings"
            echo ""
            echo "Total findings: **${total}**"
            echo ""
            if [ "$total" -gt 0 ]; then
              echo "⚠️ Do not paste the matched secret value anywhere (PR comments, Slack, ...)"
              echo "even to discuss it - rotate it at the provider first, then clean history."
              echo ""
              jq -r '.runs[0].results[] | "- **\(.ruleId)** - \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)"' gitleaks.sarif | head -c 60000
            fi
          } >> "$GITHUB_STEP_SUMMARY"
