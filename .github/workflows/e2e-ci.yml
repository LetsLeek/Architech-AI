name: E2E CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    # AIW-99: observed ~100s at time of writing, but this job installs a Chromium download
    # each run - a slow/rate-limited download shouldn't be able to hang the job past a
    # reasonable bound.
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: architech
          POSTGRES_USER: architech
          POSTGRES_PASSWORD: architech
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U architech -d architech"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/architech
      SPRING_DATASOURCE_USERNAME: architech
      SPRING_DATASOURCE_PASSWORD: architech

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Set up Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          # AIW-99: this job installs two separate npm packages (frontend/ and e2e/) - both
          # lockfiles need listing or only the first would actually get cached.
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: e2e
        # webServer entries in playwright.config.ts start the frontend and backend themselves
        # (against the Postgres service above) - no separate "start the app" step needed.
        run: npm test

      - name: Upload Playwright report
        # AIW-100: 7 days, not the 14-day default - test-results/ includes videos/traces/
        # screenshots (large binaries, only useful for debugging a recent failure), unlike the
        # small text-based SARIF security reports elsewhere in these workflows that get *longer*
        # retention for their audit value. Cost-conscious retention means picking the number per
        # artifact type, not applying one default everywhere.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  visual-regression:
    name: Visual Regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # AIW-102: deliberately NOT added to develop's required status checks - visual diffs are
    # inherently more prone to environment-driven flakiness than the other gates even with
    # animations disabled and dynamic regions masked, so this starts warning-only per
    # ci-quality-gate-policy.md's ratchet strategy, same as AIW-92 did for Playwright E2E before
    # it proved stable enough to promote (AIW-98).

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: architech
          POSTGRES_USER: architech
          POSTGRES_PASSWORD: architech
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U architech -d architech"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/architech
      SPRING_DATASOURCE_USERNAME: architech
      SPRING_DATASOURCE_PASSWORD: architech

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Set up Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        # `--with-deps` installs the same OS font/rendering package set the official Playwright
        # Docker image bundles for this Ubuntu version - baselines were generated inside that
        # image locally (see e2e/README.md) specifically so they'd match this environment.
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run visual regression tests
        working-directory: e2e
        run: npm run test:visual

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-regression-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
