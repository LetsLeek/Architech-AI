supportedOperations:
  - INITIAL_GENERATION
  - QA_REMEDIATION

operations:
  QA_REMEDIATION:
    requiresSourceCandidate: true
    requiresAuthorizedFindingRefs: true
    requiresStableProductAuthority: true
