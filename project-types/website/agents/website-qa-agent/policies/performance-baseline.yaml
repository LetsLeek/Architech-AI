id: website-performance-baseline
version: 1.0.0
environmentScope: CONTROLLED_QA_PREVIEW
notProductionSla: true
notCoreWebVitalsCertification: true

principles:
  - A catastrophic failure to reach a usable initial render is a defect.
  - Measurements are interpreted only inside the controlled QA environment.
  - Thresholds should be tuned against the platform's own stable preview infrastructure.
  - This policy must not be used to promise production Core Web Vitals.

thresholds:
  initialRender:
    mustComplete: true
  timing:
    mode: PLATFORM_CALIBRATED
    hardcodedPublicSla: false
  resources:
    mode: PLATFORM_CALIBRATED
    hardcodedPublicSla: false
