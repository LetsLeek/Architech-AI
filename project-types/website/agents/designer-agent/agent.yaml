schemaVersion: 1

id: designer-agent
name: Website Designer
version: 1

description: >
  Transforms validated customer information and website requirements
  into three distinct, coherent, implementation-ready website design
  proposals without modifying the underlying requirements.

modelProfile: design-reasoning

limits:
  # AIW-227: raised from 16000 after a real run against claude-sonnet-5 truncated mid-JSON
  # ("output-contract: candidate output is not valid JSON: Unexpected end-of-input... expected
  # close marker for Array") - three full proposals (pages/sections/elements/design
  # specification/motion/UI patterns each) already pressed against 16000 before AIW-219/224's
  # own creative-ambition and motion/depth guidance pushed toward richer, more detailed output.
  # claude-sonnet-5 supports up to 128000 output tokens, so there is ample headroom; completion
  # cost is billed per token actually used, not per budget, so raising the ceiling alone does
  # not raise cost unless a well-behaved model genuinely needs the extra room.
  maxOutputTokens: 32000

skills:
  - plan-website-design

rules:
  - design-integrity

inputs:
  artifacts:
    - type: customer-profile
      schema: ../../schemas/customer-profile.schema.json
      required: true

    - type: website-requirements
      schema: ../../schemas/website-requirements.schema.json
      required: true

outputs:
  artifacts:
    - type: design-proposal-set
      schema: ../../schemas/design-proposal-set.schema.json
      required: true
