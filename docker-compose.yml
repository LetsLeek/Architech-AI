services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-architech}
      POSTGRES_USER: ${POSTGRES_USER:-architech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-architech}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - architech-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-architech} -d ${POSTGRES_DB:-architech}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  architech-postgres-data:
