spring:
  application:
    name: backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/architech}
    username: ${SPRING_DATASOURCE_USERNAME:architech}
    password: ${SPRING_DATASOURCE_PASSWORD:architech}
  jpa:
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  web:
    error:
      # Default is "never" - the frontend needs the actual message (e.g.
      # UnsupportedProjectTypeException's text) to show a clear error, not just a bare status
      # code. No sensitive internals leak here: only exceptions this platform raises itself
      # (typically @ResponseStatus'd 4xx) carry a message worth showing; stack traces stay off.
      # Renamed from server.error.* in Spring Boot 4.
      include-message: always

architech:
  ai:
    # Maps a logical model profile (declared in an agent.yaml, e.g. "structured-reasoning")
    # to a concrete provider+model. "mock" is a placeholder provider with no real AI
    # behind it - swapping in a real one (Anthropic, OpenAI, ...) is a config change here
    # plus registering an AiProvider bean for it, never a change to any agent spec.
    model-profiles:
      structured-reasoning:
        provider: mock
        model: mock-model
    # Per-1000-token USD pricing, keyed provider -> model. Harmless to keep here even while
    # every model-profile still points at "mock" - CostCalculator only ever looks up whatever
    # provider/model actually answered, and returns null (never fabricated) for anything not
    # listed here. Anthropic's own published pricing as of 2026-09-08.
    #
    # cache-write/cache-read price the two prompt-cache token counts AnthropicProvider reports
    # separately (AIW-129) - Anthropic's standard ephemeral (5-minute) cache multipliers: writing
    # to the cache costs 1.25x a regular prompt token, reading from it costs 0.1x.
    pricing:
      anthropic:
        claude-sonnet-5:
          prompt-cost-per1000-tokens: 0.002
          completion-cost-per1000-tokens: 0.01
          cache-write-cost-per1000-tokens: 0.0025
          cache-read-cost-per1000-tokens: 0.0002
        claude-haiku-4-5-20251001:
          prompt-cost-per1000-tokens: 0.001
          completion-cost-per1000-tokens: 0.005
          cache-write-cost-per1000-tokens: 0.00125
          cache-read-cost-per1000-tokens: 0.0001
        claude-opus-5:
          prompt-cost-per1000-tokens: 0.005
          completion-cost-per1000-tokens: 0.025
          cache-write-cost-per1000-tokens: 0.00625
          cache-read-cost-per1000-tokens: 0.0005
  runner:
    # Platform-owned retry budget - agents never decide this for themselves.
    max-attempts: 3

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

---
# Opt-in only, never active by default (so a fresh clone/CI stays on the mock provider with
# zero config) - activate locally with SPRING_PROFILES_ACTIVE=real-ai plus ANTHROPIC_API_KEY
# set (see .env.example). Keeping this as a separate profile document, rather than changing
# the base model-profiles above, means "use real AI" is always an explicit, visible opt-in -
# never something a committed config change could silently turn on for everyone.
spring:
  config:
    activate:
      on-profile: real-ai

architech:
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
    model-profiles:
      structured-reasoning:
        provider: anthropic
        model: claude-sonnet-5
